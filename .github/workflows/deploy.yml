name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set env
        run: |
          echo "VITE_GPAY_UPI=${{ secrets.VITE_GPAY_UPI }}" >> $GITHUB_ENV
          echo "BASE_URL=/radi-tetra-overflow/" >> $GITHUB_ENV

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v4
        with:
          # Auto-enable Pages (build type = GitHub Actions) if not already on
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
