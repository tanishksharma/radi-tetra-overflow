<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tetra Overflow Ultra</title>
    <script>
      // GitHub Pages SPA redirect — forwards any deep link back to index.html
      // so React Router can handle the route client-side.
      (function () {
        var l = window.location;
        // GitHub Pages project path for this fork
        var base = '/radi-tetra-overflow/';
        var path = l.pathname.slice(base.length); // e.g. "play" from "/radi-tetra-overflow/play"
        var dest = l.protocol + '//' + l.hostname +
          (l.port ? ':' + l.port : '') +
          base + '?redirect=' + encodeURIComponent(path + l.search) + l.hash;
        l.replace(dest);
      })();
    </script>
  </head>
  <body></body>
</html>
